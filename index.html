<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jinesh Chudasama | Security Intelligence Operative</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'JetBrains Mono', monospace;
            -webkit-font-smoothing: antialiased;
            cursor: none;
            transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .crt-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.05) 50%);
            z-index: 9998;
            background-size: 100% 4px;
            pointer-events: none;
            opacity: 0.08;
        }

        .scanline {
            width: 100%;
            height: 1px;
            z-index: 9999;
            background: rgba(0, 255, 65, 0.05);
            position: fixed;
            top: 0;
            animation: scanlineMove 10s linear infinite;
            pointer-events: none;
        }

        @keyframes scanlineMove {
            0% { top: -2px; }
            100% { top: 100%; }
        }

        .noise-bg {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.03;
        }

        .perspective-2000 { perspective: 2000px; }
        
        .hero-glitch {
          text-shadow: 2px 2px #ff003c, -2px -2px #00a2ff;
        }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 dark:bg-black text-slate-900 dark:text-white selection:bg-emerald-500/20 selection:text-emerald-500 overflow-x-hidden">
    <div class="crt-overlay"></div>
    <div class="scanline"></div>
    <div class="noise-bg fixed inset-0 pointer-events-none"></div>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
